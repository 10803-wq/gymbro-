<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMBRO">
<meta name="description" content="แอปสร้างวินัยรายวัน ตัวละครยิ่งทำยิ่งกล้ามโต">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<title>GYMBRO</title>
<style>
:root{--bg:#0a0b0f;--s1:#12141a;--s2:#181b23;--s3:#222631;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--tx:#f1efe9;--dim:#9aa0ae;--faint:#5f6575;--gold:#f5b942;--gold2:#ffd98a;--teal:#45d6c4;--red:#ff6b6b;--nav:74px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Anuphan','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:none}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(245,185,66,.09),transparent 60%),radial-gradient(80% 40% at 100% 30%,rgba(69,214,196,.05),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--tx)}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
.disp{font-family:'Kanit','Anuphan',sans-serif}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:13px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.logo img{width:100%;height:100%;display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:'Kanit',sans-serif;font-size:20px;letter-spacing:.06em;line-height:1.1}
.brand span{font-size:12px;color:var(--dim)}
.bell{position:relative;width:42px;height:42px;border-radius:14px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.bell.on{color:var(--gold);border-color:rgba(245,185,66,.35)}
.bell.off::after{content:'';position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--s2)}

/* cards */
.card{background:linear-gradient(180deg,var(--s1),#0e1015);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.sec{margin-bottom:14px}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.04em}

/* hero */
.hero{position:relative;overflow:hidden;padding:14px 14px 16px;text-align:center}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
.date{font-size:13px;color:var(--dim);text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(245,185,66,.12);color:var(--gold)}
.chip.mute{background:var(--s3);color:var(--dim)}
.stage{position:relative;margin:6px -6px 0;aspect-ratio:300/235}
.stage .aura{position:absolute;inset:-10% -5% -5% 10%;border-radius:50%;background:radial-gradient(circle at 60% 45%,rgba(245,185,66,.5),rgba(245,185,66,0) 62%);opacity:0;pointer-events:none;transition:opacity .4s}
.stage .fig{position:relative;width:100%;height:100%;display:block}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.045) translateX(3px)}100%{transform:scale(1)}}
.pct{font-family:'Kanit',sans-serif;font-weight:700;font-size:60px;line-height:1;margin-top:2px;background:linear-gradient(180deg,#ffe9b0,#f5b942 70%,#c98d1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.pct small{font-size:26px;margin-left:2px}
.lvl{display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);font-size:13px;font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--s3);margin:14px 6px 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#c98d1c,#f5b942,#ffe9b0)}
.hint{font-size:12.5px;color:var(--dim)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:16px;font-weight:700;font-size:14.5px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#ffd98a,#f5b942 55%,#e0a02a);color:#1c1405;box-shadow:0 8px 22px rgba(245,185,66,.28)}
.btn.ghost{background:var(--s2);border:1px solid var(--line2);color:var(--tx)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:13px}
.btn.danger{background:rgba(255,107,107,.14);color:var(--red);border:1px solid rgba(255,107,107,.3)}
.row2{display:flex;gap:10px}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(245,185,66,.08);border:1px solid rgba(245,185,66,.22);font-size:13px;color:var(--gold2)}
.banner p{margin:0;flex:1}
.banner .btn{width:auto;padding:9px 13px}

/* routine list */
.head-row{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px}
.head-row h2{margin:0;font-size:17px;font-family:'Kanit',sans-serif;font-weight:600}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;border-radius:18px;background:var(--s2);border:1px solid var(--line);transition:background .2s,border-color .2s}
.row.done{background:linear-gradient(90deg,rgba(245,185,66,.11),rgba(245,185,66,.03));border-color:rgba(245,185,66,.3)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s}
.row.done .chk{background:var(--gold);border-color:var(--gold);color:#1c1405;transform:scale(1.04)}
.rmain{flex:1;min-width:0}
.rname{font-weight:500;overflow-wrap:anywhere;cursor:text}
.row.done .rname{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(245,185,66,.5)}
.rmeta{display:flex;align-items:center;gap:6px;margin-top:3px}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);padding:2px 9px 2px 7px;border-radius:99px;background:var(--s3)}
.tchip svg{width:12px;height:12px}
.tchip.add{color:var(--teal);background:rgba(69,214,196,.1)}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--faint)}
.ico:active{background:var(--s3)}
.ico.x svg{width:14px;height:14px}
.editrow{display:flex;gap:8px;align-items:center;margin-top:2px}
.in{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,185,66,.15)}
.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:14px}

/* add form */
.add{margin-top:14px;padding:14px}
.add form{display:flex;flex-direction:column;gap:10px}
.add .r{display:flex;gap:10px}
.add label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
input[type=time]{color-scheme:dark;min-width:118px}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mnav b{font-family:'Kanit',sans-serif;font-size:18px;font-weight:600}
.mnav button{width:40px;height:40px;border-radius:13px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.mnav button:disabled{opacity:.3}

/* calendar grid */
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{padding:12px 14px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.stat .lbl{display:block}
.stat b{font-family:'Kanit',sans-serif;font-size:26px;font-weight:600;color:var(--teal);line-height:1.2}
.gwrap{position:relative;overflow-x:auto;border-radius:20px;border:1px solid var(--line);background:var(--s1);-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:112px repeat(var(--n),34px);width:max-content}
.gc{height:38px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.corner,.rn{position:sticky;left:0;z-index:2;background:var(--s1);justify-content:flex-start;padding:0 10px;font-size:12.5px;border-right:1px solid var(--line)}
.rn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;line-height:38px}
.dh{font-size:11.5px;color:var(--dim);font-weight:600}
.dh.today{color:var(--gold);background:rgba(245,185,66,.1)}
.dh:disabled{opacity:.3}
.ck i{width:18px;height:18px;border-radius:6px;border:1.5px solid #333846;display:grid;place-items:center;color:#06231f}
.ck i.on{background:var(--teal);border-color:var(--teal)}
.ck i svg{width:12px;height:12px;stroke-width:3.4}
.ck.fut{opacity:.25}
.gc.bar2{height:52px;align-items:flex-end;padding-bottom:6px;border-bottom:0}
.gc.bar2 b{display:block;width:10px;border-radius:3px;background:#2b7a72;min-height:3px}
.gc.bar2 b.full{background:var(--teal);box-shadow:0 0 8px rgba(69,214,196,.5)}
.rn.dn{height:52px;line-height:60px;border-bottom:0;color:var(--dim)}
.note{font-size:12px;color:var(--faint);text-align:center;margin:12px 0 0}

/* stats */
.donut-card{display:flex;gap:16px;align-items:center;padding:16px}
.donut{position:relative;width:118px;height:118px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut b{font-family:'Kanit',sans-serif;font-size:26px;line-height:1;color:var(--gold2)}
.donut span{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
.bars{flex:1;min-width:0}
.bars .plot{display:flex;align-items:flex-end;gap:2px;height:78px;margin-top:8px}
.bars .plot b{flex:1;border-radius:2px 2px 0 0;background:#2b7a72;min-height:2px}
.bars .plot b.full{background:var(--teal)}
.bars .ax{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.chips>*,.pair>*{min-width:0}
.kpi{display:flex;gap:11px;align-items:center;padding:12px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.kpi .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi small{display:block;font-size:11.5px;color:var(--dim)}
.kpi b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi div:last-child{min-width:0}
.hof{padding:16px}
.hof h3{margin:0 0 10px;font-family:'Kanit',sans-serif;font-size:16px;display:flex;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{padding:5px 12px;border-radius:99px;background:rgba(245,185,66,.13);color:var(--gold);font-size:12.5px;font-weight:600}
.backup{margin-top:14px;padding:16px}
.backup h3{margin:0 0 4px;font-family:'Kanit',sans-serif;font-size:16px}
.backup p{margin:0 0 12px;font-size:12.5px;color:var(--dim)}

/* rewards + install */
.rewards-card{padding:14px;margin:10px 0 14px;background:linear-gradient(180deg,#14171d,#0d1015)}
.reward-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.reward-head b{display:block;letter-spacing:.14em;font-size:11px}.reward-head span{display:block;color:var(--dim);font-size:10px;margin-top:3px}.reward-count{font-family:'Kanit';font-size:16px;color:var(--gold2);padding:4px 9px;border-radius:10px;background:rgba(245,185,66,.08);border:1px solid rgba(245,185,66,.16)}
.reward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}.reward{min-width:0;padding:8px 6px;border-radius:12px;text-align:center;background:#101319;border:1px solid rgba(255,255,255,.055);opacity:.42}.reward.on{opacity:1;border-color:rgba(245,185,66,.22);background:linear-gradient(180deg,#1b1710,#101319)}.reward-icon{font-size:16px;filter:grayscale(1);margin-bottom:3px}.reward.on .reward-icon{filter:none}.reward b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reward small{display:block;color:#6e7480;font-size:7px;line-height:1.25;margin-top:2px}.reward-xp{margin-top:11px;padding:10px;border-radius:13px;background:rgba(245,185,66,.06);border:1px solid rgba(245,185,66,.12)}.reward-xp b{display:block;font-size:10px}.reward-xp small{display:block;color:#737985;font-size:8px;margin-top:2px}.reward-xpbar{height:5px;border-radius:99px;background:#282c35;overflow:hidden;margin-top:7px}.reward-xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c98d1c,#f5b942,#fff0bd);transition:width .5s ease}.quote-pulse{animation:quotePulse .55s ease}@keyframes quotePulse{0%{opacity:.45;transform:translateY(3px)}100%{opacity:1;transform:none}}
.install-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border:1px solid rgba(245,185,66,.25);background:linear-gradient(135deg,#211b10,#15171d);border-radius:16px}.install-card b{display:block;font-size:12px}.install-card span{display:block;color:var(--dim);font-size:10px;margin-top:2px}.compact-banner{padding:9px 11px}.compact-banner .i{color:var(--gold)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav>div{pointer-events:auto;width:100%;max-width:480px;display:flex;padding:6px;border-radius:24px;background:rgba(20,22,29,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 12px 34px rgba(0,0,0,.55)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:18px;font-size:11.5px;font-weight:600;color:var(--faint);transition:all .2s}
.nav button.on{color:var(--gold);background:rgba(245,185,66,.11)}

/* sheet + toast */
.back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.back.show{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line2);margin:2px auto 12px}
.sheet h3{margin:0;font-family:'Kanit',sans-serif;font-size:19px;font-weight:600}
.sheet .stage{margin:6px 0 0;background:#12141a}
.sub{color:var(--dim);font-size:13px}
.dl{display:flex;flex-direction:column;gap:7px;margin:8px 0 14px}
.di{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--s2);font-size:14px}
.di svg{width:16px;height:16px}
.di.ok svg{color:var(--gold)}
.di.no{color:var(--dim)}
.di.no svg{color:var(--faint)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:88vw;padding:11px 18px;border-radius:99px;background:#232732;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}

.hero{background:#101218}

/* ===== GYMBRO V5 APP REDESIGN ===== */
:root{--paper:#f3efe5;--ink:#191a1d;--gold:#f0bd5a}
.app{max-width:510px;padding-left:14px;padding-right:14px}
.top{padding-top:2px;margin-bottom:10px}
.logo{width:44px;height:44px;border-radius:14px}
.brand b{font-size:22px;letter-spacing:.08em}
.profile-card{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:12px;border-radius:18px;background:linear-gradient(135deg,#161920,#0d0f13);border:1px solid rgba(245,185,66,.16)}
.avatar-mark,.profile-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe8af,#d79d36 62%,#60411b);color:#1b1407;font-family:'Kanit';font-weight:700}
.profile-main{flex:1;min-width:0}.profile-main span{display:block;font-size:9px;letter-spacing:.16em;color:var(--dim)}.profile-main b{display:block;font-size:13px;margin-top:2px}
.profile-mini{padding-left:10px;border-left:1px solid var(--line);text-align:center}.profile-mini span{display:block;font-size:8px;color:var(--dim);letter-spacing:.12em}.profile-mini b{display:block;color:var(--gold);font-family:'Kanit';font-size:17px}
.hero{padding:14px 12px 13px;background:linear-gradient(180deg,#15171d 0%,#0c0e12 100%);border-color:rgba(255,255,255,.09);box-shadow:0 18px 42px rgba(0,0,0,.46)}
.hero-copy{display:flex;justify-content:space-between;align-items:flex-end;text-align:left;margin:9px 3px 0}.eyebrow{font-size:9px;letter-spacing:.16em;color:#8e949f;text-transform:uppercase}.hero-title{font-family:'Kanit';font-size:19px;line-height:1.1;margin-top:2px}.power-badge{padding:6px 10px;border-radius:999px;background:#f4f0e7;color:#141518;font-weight:800;font-size:11px}
.stage-shell{position:relative;margin:10px -2px 2px;padding:5px;border-radius:22px;background:linear-gradient(135deg,#20232a,#0d0f13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.stage-shell .paper-grain{position:absolute;inset:5px;border-radius:17px;opacity:.38;pointer-events:none;background-image:radial-gradient(rgba(30,30,30,.14) .7px,transparent .7px);background-size:7px 7px;mix-blend-mode:multiply}
.stage{margin:0;aspect-ratio:300/235;border-radius:17px;overflow:hidden;background:#050505;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:background .45s ease,box-shadow .45s ease}.stage.sunrise{box-shadow:inset 0 0 0 1px rgba(255,214,120,.18),0 0 35px rgba(245,185,66,.12)}
.stage .fig{filter:contrast(1.04)}
.stage .aura{inset:0;background:radial-gradient(circle at 72% 34%,rgba(255,214,125,.5),rgba(245,185,66,.16) 22%,rgba(245,185,66,0) 62%);mix-blend-mode:screen;transition:opacity .45s ease}
.progress-row{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:8px}.progress-kicker{font-size:10px;color:#858b95;letter-spacing:.1em}.pct{font-size:56px;margin-top:0}.pct small{font-size:23px}
.level-stack{text-align:right;padding-bottom:5px}.lvl{margin-top:0;padding:5px 10px;background:#20232b;font-size:11px}.burden{font-size:10px;color:#a4a7af;margin-top:4px}
.bar{height:8px;margin:11px 3px 8px;background:#23262e}.bar i{background:linear-gradient(90deg,#a97724,#f5c968,#fff0c4);box-shadow:0 0 12px rgba(245,185,66,.24)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 6px}.hero-stats>div{padding:9px 8px;border-radius:13px;background:#171a20;border:1px solid rgba(255,255,255,.05)}.hero-stats span{display:block;font-size:9px;color:#7d838f}.hero-stats b{display:block;font-size:12px;margin-top:2px;color:#efe9da}
.quote{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.09);font-size:11px;color:#b4b7bf;text-align:left;font-style:italic}

<script>
/* ==========================================================================
   Ink-sketch line figure: a lone worker shoving a scribbled boulder up a slope.
   pct 0  -> frail thin grey lines, hunched, sweating, dim
   pct 100-> thick hatched muscle, bright cream/gold, gritted teeth, cracking rock
   Everything is procedural + deterministic (seeded) so it animates smoothly.
   ========================================================================== */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hexRGB(a),B=hexRGB(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')};

const _rng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}};

/* smooth closed/open curve through points (Catmull-Rom -> cubic bezier) */
function _smooth(p,closed){
  const f=n=>+n.toFixed(1),N=p.length;let d='M'+f(p[0][0])+' '+f(p[0][1]);
  const g=i=>closed?p[(i+N)%N]:p[clamp(i,0,N-1)];
  const end=closed?N:N-1;
  for(let i=0;i<end;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1]);
  }
  return d+(closed?'Z':'');
}

/* ---- boulder geometry in unit space, generated once ---- */
const _B=(()=>{
  const r=_rng(7);
  const ring=(amp,n)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return[Math.cos(a)*(1+(r()-.5)*amp),Math.sin(a)*(1+(r()-.5)*amp)]});
  const out1=ring(.035,26),out2=ring(.05,22).map(p=>[p[0]*.985,p[1]*.985]);
  /* contour hatch arcs hugging the shadow side (lower-right) */
  const arcs=[];
  for(let k=0;k<17;k++){
    const rad=.97-k*.048, span=(1.9-k*.085)*(.85+r()*.3), mid=.75+(r()-.5)*.25;
    const n=Math.max(4,Math.round(span*6)), pts=[];
    for(let i=0;i<=n;i++){const a=mid-span/2+span*i/n, rr=rad*(1+(r()-.5)*.02);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
    arcs.push({pts,k});
  }
  /* loose scribble loops on the lit side */
  const loops=[];
  for(let k=0;k<11;k++){
    const cx=-.15-r()*.35+(r()-.5)*.3, cy=-.2-r()*.4+(r()-.5)*.3, R=.18+r()*.28, turns=1.3+r()*1.2, rot=r()*6, pts=[];
    const n=Math.round(turns*7);
    for(let i=0;i<=n;i++){const a=rot+i/7*Math.PI*2*(1);const rr=R*(1-i/(n+1)*.5)*(.8+r()*.4);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.85])}
    loops.push(pts);
  }
  /* a few long sweeping strands across the whole sphere */
  const strands=[];
  for(let k=0;k<6;k++){
    const a0=r()*6.28,a1=a0+1.2+r()*1.6,pts=[];
    for(let i=0;i<=8;i++){const a=a0+(a1-a0)*i/8,rr=(.35+r()*.55);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
    strands.push(pts);
  }
  return{out1,out2,arcs,loops,strands};
})();

function figure(pct,opts){
  opts=opts||{};
  const t=clamp(pct/100,0,1), f=n=>+n.toFixed(1);
  /* Narrative environment: pitch-black struggle -> warm dawn -> white/gold light. */
  const env= t<.25 ? mix('#050505','#18191c',t/.25) :
             t<.55 ? mix('#18191c','#575451',(t-.25)/.30) :
             t<.82 ? mix('#575451','#d7d1c5',(t-.55)/.27) :
                       mix('#d7d1c5','#fffaf0',(t-.82)/.18);
  const paper=t>=.48;
  const col=paper?mix('#2a2928','#121212',(t-.48)/.52):mix('#eee8dc','#a79f90',t/.48);
  const farCol=paper?mix('#6c665d','#40351f',(t-.48)/.52):mix('#a9a193','#ddd0b4',t/.48);
  const gold=paper?mix('#9d7836','#f4c95f',(t-.48)/.52):mix('#8a7657','#f3c76a',t/.48);
  const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
  const at=(o,v,k)=>({x:o.x+v.x*k,y:o.y+v.y*k});
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const P=p=>f(p.x)+' '+f(p.y);

  /* ---------- world: steep hand-sketched hill ---------- */
  const th=20*Math.PI/180, tn=Math.tan(th);
  const gy=x=>224-tn*(x-10);
  const nrm={x:-Math.sin(th),y:-Math.cos(th)}, along={x:Math.cos(th),y:-Math.sin(th)};

  /* ---------- body: tiny worker -> powerful athlete ---------- */
  const hip={x:82,y:159};
  const L=lerp(57,42,t)*Math.PI/180;
  const d={x:Math.sin(L),y:-Math.cos(L)}, n={x:Math.cos(L),y:Math.sin(L)};
  const sh=at(hip,d,lerp(49,55,t));
  const headR=lerp(9.5,11.5,t);
  const hc=add(at(sh,d,lerp(19,22,t)),at({x:0,y:0},n,lerp(7,-1,t)));
  const cw=lerp(4,21,t), ww=lerp(3.5,11,t);

  /* ---------- boulder: burden grows dramatically with progress ---------- */
  const R=lerp(18,96,t);
  const cxContact=lerp(214,204,t);
  const cp={x:cxContact,y:gy(cxContact)};
  const bc=at(cp,nrm,R);
  const toSh={x:sh.x-bc.x,y:sh.y-bc.y}, dl=Math.hypot(toSh.x,toSh.y)||1;
  const phi=Math.atan2(toSh.y,toSh.x);
  const onRock=a=>({x:bc.x+Math.cos(a)*(R-2),y:bc.y+Math.sin(a)*(R-2)});
  const hand1=onRock(phi), hand2=onRock(phi+.24);

  /* ---------- IK ---------- */
  const ik=(s,h,l1,l2,side)=>{
    let vx=h.x-s.x,vy=h.y-s.y,D=Math.hypot(vx,vy)||1;
    const mx=l1+l2-.8;
    if(D>mx){vx*=mx/D;vy*=mx/D;D=mx;h={x:s.x+vx,y:s.y+vy}}
    const a=(l1*l1-l2*l2+D*D)/(2*D),hh=Math.sqrt(Math.max(l1*l1-a*a,0));
    return{m:{x:s.x+vx/D*a+side*(-vy/D)*hh,y:s.y+vy/D*a+side*(vx/D)*hh},h};
  };
  const armReach=lerp(30,47,t);
  const legReach=lerp(30,36,t);
  const sA=add(at(sh,n,cw*.38),{x:-d.x*3,y:-d.y*3});
  const sB=add(at(sh,n,-cw*.14),{x:-d.x*5,y:-d.y*5});
  const A1=ik(sA,hand1,armReach,armReach,1);
  const A2=ik(sB,hand2,armReach*.95,armReach*.95,1);
  const fFoot={x:hip.x+31,y:gy(hip.x+31)}, bFoot={x:hip.x-27,y:gy(hip.x-27)};
  const hipN=add(hip,{x:2,y:2});
  const Lf=ik(hipN,fFoot,legReach,legReach,-1), Lb=ik(hipN,bFoot,legReach,legReach,1);

  /* ---------- rough ink limbs ---------- */
  const hatchOp=clamp((t-.08)*2.1,0,.85);
  const limb=(a,b,w1,wm,w2,stroke,fillOp,hatch)=>{
    const vx=b.x-a.x,vy=b.y-a.y,Ln=Math.hypot(vx,vy)||1,px=-vy/Ln,py=vx/Ln;
    const C=2*wm-(w1+w2)/2, m=mid(a,b);
    const o1={x:a.x+px*w1,y:a.y+py*w1},o2={x:b.x+px*w2,y:b.y+py*w2},i1={x:a.x-px*w1,y:a.y-py*w1},i2={x:b.x-px*w2,y:b.y-py*w2};
    const c1={x:m.x+px*C,y:m.y+py*C},c2={x:m.x-px*C,y:m.y-py*C};
    let s='<path d="M'+P(o1)+'Q'+P(c1)+' '+P(o2)+'L'+P(i2)+'Q'+P(c2)+' '+P(i1)+'Z" fill="'+stroke+'" fill-opacity="'+f(fillOp)+'"/>';
    if(hatch&&hatchOp>0){
      const cnt=Math.max(2,Math.floor(Ln/4)),tk=[];
      for(let k=1;k<=cnt;k++){
        const q=k/(cnt+1),w=(1-q)*(1-q)*w1+2*q*(1-q)*C+q*q*w2,cx=a.x+vx*q,cy=a.y+vy*q;
        tk.push('M'+f(cx+px*w*.15)+' '+f(cy+py*w*.15)+'L'+f(cx+px*w*.95+vx/Ln*2.2)+' '+f(cy+py*w*.95+vy/Ln*2.2));
      }
      s+='<path d="'+tk.join('')+'" stroke-width=".85" opacity="'+f(hatchOp)+'"/>';
    }
    return s;
  };
  const sw=1.25;
  const fo=lerp(.65,.10,t);
  const W=(a,b)=>lerp(a,b,t);
  const arm=(s,A,stroke)=>'<g stroke="'+stroke+'" stroke-width="'+sw+'">'
    +limb(s,A.m,W(1.8,7.8),W(2.2,12.5),W(1.4,6),stroke,fo,1)
    +limb(A.m,A.h,W(1.5,6.4),W(1.8,8.8),W(1.2,3.7),stroke,fo,1)
    +'<circle cx="'+f(A.h.x)+'" cy="'+f(A.h.y)+'" r="'+f(W(2.2,4.8))+'" fill="'+env+'" stroke="none"/></g>';
  const leg=(Lg,stroke)=>'<g stroke="'+stroke+'" stroke-width="'+sw+'">'
    +limb(hipN,Lg.m,W(2.2,9.5),W(2.5,12.8),W(1.6,5.5),stroke,fo,1)
    +limb(Lg.m,Lg.h,W(1.6,5.5),W(2,8.8),W(1.3,3.4),stroke,fo,1)+'</g>';
  const foot=(h,dir,up)=>'<path d="M'+P(h)+'l'+f(along.x*10*dir)+' '+f(along.y*10*dir+up)+'" stroke="'+col+'" stroke-width="'+f(lerp(2.2,5.2,t))+'"/>';

  /* ---------- torso mass + chest/back definition ---------- */
  const hb=at(hip,n,-ww),hf=at(hip,n,ww),sb=at(sh,n,-cw),sf=at(sh,n,cw);
  const cb=at(mid(sb,hb),n,-lerp(2,14,t)), cf=at(mid(hf,sf),n,lerp(0,9,t));
  let torso='<path d="M'+P(hb)+'Q'+P(cb)+' '+P(sb)+'L'+P(sf)+'Q'+P(cf)+' '+P(hf)+'Z" fill="'+col+'" fill-opacity="'+f(lerp(.48,.08,t))+'"/>';
  if(hatchOp>0){
    const tk=[],cnt=10,q=(p0,c,p1,s)=>({x:(1-s)*(1-s)*p0.x+2*s*(1-s)*c.x+s*s*p1.x,y:(1-s)*(1-s)*p0.y+2*s*(1-s)*c.y+s*s*p1.y});
    for(let k=1;k<=cnt;k++){const s=k/(cnt+1),a=q(hf,cf,sf,s),b=q(hb,cb,sb,s);tk.push('M'+P(a)+'L'+f(a.x+(b.x-a.x)*.58)+' '+f(a.y+(b.y-a.y)*.58))}
    torso+='<path d="'+tk.join('')+'" stroke-width=".85" opacity="'+f(hatchOp)+'"/>';
    if(t>.42)torso+='<path d="M'+P(at(mid(sb,hb),n,-lerp(3,14,t)*.5))+'L'+P(at(sb,n,cw*.35))+'" stroke-width="1.2" opacity="'+f(clamp((t-.42)*2,.0,.7))+'"/>';
    if(t>.55){
      const chestY=sh.y+lerp(13,15,t);
      torso+='<path d="M'+f(sh.x-lerp(2,14,t))+' '+f(chestY)+'q'+f(lerp(8,18,t))+' '+f(lerp(4,2,t))+' '+f(lerp(18,28,t))+' '+f(chestY+2)+'" stroke-width="1" opacity="'+f(clamp((t-.55)*1.8,0,.75))+'"/>';
      torso+='<path d="M'+f(sh.x+lerp(2,14,t))+' '+f(chestY)+'q-'+f(lerp(8,18,t))+' '+f(lerp(4,2,t))+' -'+f(lerp(18,28,t))+' '+f(chestY+2)+'" stroke-width="1" opacity="'+f(clamp((t-.55)*1.8,0,.75))+'"/>';
    }
  }
  const neck='<path d="M'+P(at(sh,d,-1))+'L'+P(at(hc,{x:-d.x,y:-d.y},headR-2))+'" stroke-width="'+f(lerp(2.1,7.5,t))+'"/>';

  /* ---------- head / silhouette ---------- */
  const tilt=lerp(20,8,t);
  let face='<circle cx="'+f(hc.x)+'" cy="'+f(hc.y)+'" r="'+headR+'" fill="'+env+'" stroke="none"/>'
    +'<circle cx="'+f(hc.x)+'" cy="'+f(hc.y)+'" r="'+headR+'" fill="'+col+'" fill-opacity="'+f(lerp(.22,.035,t))+'"/>';

async function fire(r){
  const title='ถึงเวลา: '+r.name,body='ทำเสร็จแล้วอย่าลืมติ๊กในแอปนะ';
  toast(title);
  if(perm()!=='granted')return;
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const o={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'gb-'+r.id+'-'+dkey(),vibrate:[140,70,140],lang:'th',data:{url:'./'}};
    if(reg&&reg.showNotification)await reg.showNotification(title,o);else new Notification(title,o);

function checkReminders(){
  const now=new Date(),k=dkey(now),mins=now.getHours()*60+now.getMinutes();
  const sent=loadSent(),cut=dkey(new Date(now.getTime()-4*864e5));
  Object.keys(sent).forEach(x=>{if(x<cut)delete sent[x]});
  const list=sent[k]||(sent[k]=[]),s=doneSet(k);let ch=false;
  state.routines.forEach(r=>{
    if(!r.time||s.has(r.id)||list.includes(r.id))return;
    const p=r.time.split(':').map(Number);if(p.length<2||isNaN(p[0])||isNaN(p[1]))return;
    const diff=mins-(p[0]*60+p[1]);
    if(diff>=0&&diff<=2){list.push(r.id);ch=true;fire(r)}
  });
  if(ch)try{localStorage.setItem(SENT_KEY,JSON.stringify(sent))}catch(e){}
}

let view={y:new Date().getFullYear(),m:new Date().getMonth()};
function monthData(y,m){
  const n=dim(y,m),now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
  const last=(y===cy&&m===cm)?now.getDate():((y<cy||(y===cy&&m<cm))?n:0);
  const days=[],skips={};state.routines.forEach(r=>skips[r.id]=0);
  let sum=0,doneTotal=0,best=null;const hof=[];
  for(let d=1;d<=n;d++){
    const k=mkey(y,m,d);
    if(d>last){days.push({d,k,p:null,s:null});continue}
    const s=doneSet(k),p=total()?Math.round(s.size/total()*100):0;
    days.push({d,k,p,s});sum+=p;doneTotal+=s.size;
    if(p>0&&(!best||p>best.p))best={d,p};
    if(p===100&&total())hof.push(d);
    state.routines.forEach(r=>{if(!s.has(r.id))skips[r.id]++});
  }
  let ms=null,mc=0;
  if(last>0)state.routines.forEach(r=>{if(skips[r.id]>mc){mc=skips[r.id];ms=r}});
  return{n,last,days,avg:last?Math.round(sum/last):0,doneTotal,best,hof,ms,mc};
}

   +'</div>'
   +'<div class="card hof"><h3>'+ic('trophy')+'Hall of Fame · วันที่ครบ 100%</h3>'+(md.hof.length?'<div class="pills">'+md.hof.map(d=>'<span class="pill">วันที่ '+d+'</span>').join('')+'</div>':'<div class="sub">เดือนนี้ยังไม่มีวันที่ครบ 100% อีกนิดเดียว!</div>')+'</div>'
   +'<div class="card backup"><h3>สำรองข้อมูล</h3><p>ข้อมูลเก็บในเครื่องนี้เท่านั้น ควรสำรองไว้เผื่อล้างข้อมูลแอป/เปลี่ยนเครื่อง</p><div class="row2"><button class="btn ghost sm" data-a="export">'+ic('down')+'ส่งออก</button><button class="btn ghost sm" data-a="import">'+ic('up')+'นำเข้า</button></div></div>';
}
function exportData(){
  const b=new Blob([JSON.stringify({app:'gymbro',v:3,exported:new Date().toISOString(),routines:state.routines,done:state.done,rewards:state.rewards,totalXP:totalXP()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gymbro-backup-'+dkey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('ส่งออกข้อมูลแล้ว');
}
function validate(o){
  if(!o||!Array.isArray(o.routines)||!o.done||typeof o.done!=='object')return null;
  const routines=o.routines.filter(r=>r&&typeof r.id==='string'&&typeof r.name==='string').map(r=>({id:r.id,name:r.name.slice(0,40),time:/^\d\d:\d\d$/.test(r.time||'')?r.time:''}));
  const done={};Object.keys(o.done).forEach(k=>{if(/^\d{4}-\d\d-\d\d$/.test(k)&&Array.isArray(o.done[k]))done[k]=o.done[k].filter(x=>typeof x==='string')});
  const rewards=Array.isArray(o.rewards)?o.rewards.filter(r=>r&&typeof r.id==='string').map(r=>({id:r.id,at:typeof r.at==='string'?r.at:new Date().toISOString()})):[];
  return{routines,done,rewards};
}

/* ---------- profile ---------- */
function profileSheet(){
  const st=streaks(), p=pctOf(dkey()), ap=accountLevelProgress();
  const all=ap.xp/120;
  const nextText=ap.i>=LEVELS.length-1?'MAX POWER · คุณสะสมพลังครบเส้นทางแล้ว':'อีก '+ap.remaining+' XP จะขึ้น LEVEL '+(ap.i+2);
  sheet('<div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h3>GYMBRO PROFILE</h3><div class="sub">เลเวลถาวรเติบโตจาก XP ที่คุณสะสมจริง ไม่รีเซ็ตเมื่อเปลี่ยนวัน</div></div><button class="ico" data-a="close-sheet">'+ic('x')+'</button></div>'
    +'<div class="profile-sheet-hero"><div class="profile-avatar">G</div><div><div class="eyebrow">CURRENT POWER</div><div class="profile-level">LEVEL '+(ap.i+1)+'</div><div class="sub">'+LEVELS[ap.i].name+'</div></div></div>'
    +'<div class="pair"><div class="stat"><span class="lbl">วันนี้</span><b>'+p+'%</b></div><div class="stat"><span class="lbl">สตรีค</span><b>'+st.cur+' วัน</b></div></div>'
    +'<div class="pair"><div class="stat"><span class="lbl">สะสม XP</span><b>'+ap.xp+'</b></div><div class="stat"><span class="lbl">กิจวัตรทั้งหมด</span><b>'+all+'</b></div></div>'
    +'<div class="card" style="padding:13px;margin:10px 0 14px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:11px"><b>XP PROGRESS</b><span class="sub">'+nextText+'</span></div><div class="reward-xpbar" style="margin-top:9px"><i style="width:'+ap.progress+'%"></i></div></div>'
    +'<div class="level-road">'+LEVELS.map((l,i)=>'<div class="'+(i===ap.i?'active ':'')+(i<ap.i?'done':'')+'"><span>'+(i+1)+'</span><div><b>'+l.short+'</b><small>'+l.name+' · '+(LEVEL_XP[i]||0)+' XP</small></div></div>').join('')+'</div>'
    +'<div class="sub" style="margin-bottom:12px">ฉากของวันนี้ยังเปลี่ยนตาม '+p+'% แต่ POWER LEVEL จะไม่ตกกลับในวันพรุ่งนี้</div>'
    +'<button class="btn ghost" data-a="close-sheet">กลับไปที่แอป</button>');
}



/* ---------- navigation ---------- */
let tab='today';
function setTab(t){
  tab=t;
  ['today','calendar','stats'].forEach(x=>{$('#tab-'+x).hidden=x!==t});
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='today')renderToday();else if(t==='calendar')renderCalendar();else renderStats();
  window.scrollTo(0,0);
}
function shiftMonth(d){
  let m=view.m+d,y=view.y;if(m<0){m=11;y--}else if(m>11){m=0;y++}
  const n=new Date();if(y>n.getFullYear()||(y===n.getFullYear()&&m>n.getMonth()))return;
  view={y,m};setTab(tab);
}
function endDay(){const n=new Date();view={y:n.getFullYear(),m:n.getMonth()};setTab('calendar');openDay(dkey())}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,row=el.closest('[data-id]'),id=row&&row.dataset.id;
  if(a==='close-sheet'){if(el.id==='back'&&e.target!==el)return;closeSheet();return}
  switch(a){
    case 'tab':setTab(el.dataset.t);break;
    case 'toggle':toggle(id);break;
    case 'edit-name':edit={id,kind:'name',focus:true};renderToday();break;
    case 'edit-time':edit={id,kind:'time',focus:true};renderToday();break;
    case 'save-edit':saveEdit();break;
    case 'cancel-edit':edit=null;renderToday();break;
    case 'clear-time':{const r=state.routines.find(x=>x.id===id);if(r)r.time='';edit=null;save();renderToday();break}
    case 'delete':{const r=state.routines.find(x=>x.id===id);if(!r)break;
      confirmSheet('ลบกิจวัตรนี้?','"'+esc(r.name)+'" จะถูกลบ และไม่ถูกนับในสถิติอีก','ลบ',()=>{
        state.routines=state.routines.filter(x=>x.id!==id);
        Object.keys(state.done).forEach(k=>{state.done[k]=state.done[k].filter(x=>x!==id)});
        save();closeSheet();renderToday();toast('ลบแล้ว')});break}
    case 'confirm-ok':if(onOk){const f=onOk;onOk=null;f()}break;
    case 'end-day':endDay();break;
    case 'day':openDay(el.dataset.k);break;
    case 'to-today':closeSheet();setTab('today');break;
    case 'mprev':shiftMonth(-1);break;
    case 'mnext':shiftMonth(1);break;
    case 'bell':askNotif();break;
    case 'test-bell':fire({id:'test',name:'ทดสอบการแจ้งเตือน'});break;
    case 'install':installApp();break;
    case 'profile-sheet':profileSheet();break;
    case 'export':exportData();break;
    case 'import':$('#imp').click();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ed'){if(e.key==='Enter'){e.preventDefault();saveEdit()}else if(e.key==='Escape'){edit=null;renderToday()}}
  else if(e.key==='Escape')closeSheet();
});
$('#add-form').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('#new-name').value.trim();if(!n){toast('ใส่ชื่อกิจวัตรก่อนนะ');return}
  state.routines.push({id:uid(),name:n.slice(0,40),time:$('#new-time').value||''});
  $('#new-name').value='';$('#new-time').value='';save();renderToday();toast('เพิ่มกิจวัตรแล้ว');
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{let d=null;try{d=validate(JSON.parse(rd.result))}catch(x){}
    if(!d){toast('ไฟล์สำรองไม่ถูกต้อง');return}
    confirmSheet('นำเข้าข้อมูล?','จะแทนที่ข้อมูลปัจจุบันด้วยข้อมูลจากไฟล์ ('+d.routines.length+' กิจวัตร)','นำเข้า',()=>{state=d;save();closeSheet();setTab(tab);toast('นำเข้าข้อมูลแล้ว')})};
  rd.readAsText(f);
});

/* ---------- clock: reminders + day rollover ---------- */
let lastKey=dkey();
function tick(){
  if(dkey()!==lastKey){lastKey=dkey();const n=new Date();view={y:n.getFullYear(),m:n.getMonth()};edit=null;setTab(tab)}
  checkReminders();
  rotateEncouragement();
}
setInterval(tick,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- boot ---------- */
if(!localStorage.getItem(KEY))save();
setTab('today');
setTimeout(checkReminders,1200);
renderInstall();
checkRewards();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
</body>
